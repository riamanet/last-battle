name: Tracker API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Alliance Test
        env:
          TRACKER_API_KEY: ${{ secrets.TRACKER_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          key = os.environ["TRACKER_API_KEY"]
          tag = urllib.parse.quote("요즘사람")
          url = f"https://api.lastasylumtracker.com/v1/alliances/252/{tag}?fresh=1"

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + key,
                  "User-Agent": "LastBattle/1.0"
              }
          )

          with urllib.request.urlopen(req, timeout=60) as res:
              data = json.load(res)

          def find_members(obj):
              if isinstance(obj, dict):
                  if isinstance(obj.get("members"), list):
                      return obj["members"]
                  for value in obj.values():
                      found = find_members(value)
                      if found is not None:
                          return found
              return None

          members = find_members(data)
          if members is None:
              raise RuntimeError("Roster not found")

          print("ALLIANCE CONNECTION SUCCESS")
          print("Members:", len(members))

          for field in ["uid", "name", "power", "online",
                        "last_online_at", "active"]:
              count = sum(m.get(field) is not None for m in members)
              print(field, ":", count)
          PY
