name: Tracker API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Hero Power Test
        env:
          TRACKER_API_KEY: ${{ secrets.TRACKER_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          name = urllib.parse.quote("두부상")
          url = f"https://api.lastasylumtracker.com/v1/players/252/{name}?fresh=1"

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + os.environ["TRACKER_API_KEY"],
                  "User-Agent": "LastBattle/1.0"
              }
          )

          with urllib.request.urlopen(req, timeout=60) as res:
              data = json.load(res)

          heroes = data.get("ranks", {}).get("heroes", {})
          print("HERO POWER:", heroes.get("score"))
          print("HERO RANK:", heroes.get("rank"))
          print("TOTAL POWER:", data.get("power"))
          print("DATA AGE:", data.get("age_seconds"))
          PY
