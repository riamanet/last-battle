name: Tracker API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Last Login Test
        env:
          TRACKER_API_KEY: ${{ secrets.TRACKER_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          targets = [
              (225, "Crit"),
              (252, "요즘사람"),
              (252, "CROW."),
              (256, "EMAF")
          ]

          def get(path):
              req = urllib.request.Request(
                  "https://api.lastasylumtracker.com/v1/" + path,
                  headers={
                      "Authorization": "Bearer " + os.environ["TRACKER_API_KEY"],
                      "User-Agent": "LastBattle/1.0"
                  }
              )
              with urllib.request.urlopen(req, timeout=60) as res:
                  return json.load(res)

          def find_members(obj):
              if isinstance(obj, dict):
                  if isinstance(obj.get("members"), list):
                      return obj["members"]
                  for value in obj.values():
                      found = find_members(value)
                      if found is not None:
                          return found
              return None

          def check(data):
              members = find_members(data)
              if not members:
                  print("NO MEMBERS")
                  return

              print("MEMBERS:", len(members))
              print("DATA AGE:", data.get("age_seconds"))

              for field in ["online", "last_online_at",
                            "joined_at", "active"]:
                  count = sum(
                      m.get(field) is not None
                      for m in members
                  )
                  print(field, count, "/", len(members))

              states = {}
              for m in members:
                  value = str(m.get("online"))
                  states[value] = states.get(value, 0) + 1
              print("ONLINE STATES:", states)

          for server, tag in targets:
              path = f"alliances/{server}/{urllib.parse.quote(tag)}"

              for fresh in [False, True]:
                  print("---", server, tag, "FRESH:", fresh)
                  try:
                      check(get(path + ("?fresh=1" if fresh else "")))
                  except Exception as e:
                      print("ERROR:", type(e).__name__)
          PY
